name: Railway Search Engine
on:
  workflow_dispatch:
    inputs:
      job_id: { description: 'Internal Job ID', required: true }
      chat_id: { description: 'Telegram Chat ID', required: true }
      username: { description: 'Telegram Username', required: true }
      from_station: { description: 'From', required: true }
      to_station: { description: 'To', required: true }
      journey_date: { description: 'Date', required: true }
      seat_class: { description: 'Class Regex', required: true }
      user_phone: { description: 'Phone for session', required: false }
      user_pass: { description: 'Password for session', required: false } 
      desired_trains:
        description: 'Desired Trains'
        required: false
        default: 'ALL'
jobs:
  run-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # This automatically caches your pip packages based on requirements.txt
          cache: 'pip'

      # 1. Cache Playwright Browsers (The biggest download)
      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # 2. Install System Dependencies (Including the required tkinter)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev python3-tk python3-dev google-chrome-stable

      # 3. Install Python Dependencies from requirements.txt
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright Browsers ONLY if not restored from cache
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Run Monitor
        env:
          CI: "true"
          JOB_ID: ${{ github.event.inputs.job_id }}
          CHAT_ID: ${{ github.event.inputs.chat_id }}
          USERNAME: ${{ github.event.inputs.username }}
          FROM_STATION: ${{ github.event.inputs.from_station }}
          TO_STATION: ${{ github.event.inputs.to_station }}
          JOURNEY_DATE: ${{ github.event.inputs.journey_date }}
          SEAT_CLASS: ${{ github.event.inputs.seat_class }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          RAILWAY_PHONE: ${{ github.event.inputs.user_phone || secrets.RAILWAY_PHONE }}
          RAILWAY_PASSWORD: ${{ github.event.inputs.user_pass || secrets.RAILWAY_PASSWORD }}
          DESIRED_TRAINS: ${{ github.event.inputs.desired_trains }}
        run: xvfb-run -a python bot_backup.py
