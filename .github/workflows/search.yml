name: Railway Search Engine

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Internal Job ID'
        required: true
        type: string

      chat_id:
        description: 'Telegram Chat ID'
        required: true
        type: string

      username:
        description: 'Telegram Username'
        required: true
        type: string

      from_station:
        description: 'From'
        required: true
        type: string

      to_station:
        description: 'To'
        required: true
        type: string

      journey_date:
        description: 'Date'
        required: true
        type: string

      seat_class:
        description: 'Class Regex'
        required: true
        type: string

      desired_trains:
        description: 'Desired Trains'
        required: false
        default: 'ALL'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  run-search:
    runs-on: ubuntu-latest
    # Absolute ceiling. Your script self-terminates at ~5.75h (MAX_RUNTIME_SECONDS).
    # GitHub-hosted runners cap at 360 minutes (6h).
    timeout-minutes: 355

    steps:
      # Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull the already-built image
      - name: Pull Railway Search image
        run: |
          docker pull ghcr.io/shuvo-924/railway-search:latest

      # Run the search
      - name: Run Monitor
        timeout-minutes: 350
        env:
          CI: "true"

          # Job inputs (from workflow_dispatch)
          JOB_ID: ${{ inputs.job_id }}
          CHAT_ID: ${{ inputs.chat_id }}
          USERNAME: ${{ inputs.username }}
          FROM_STATION: ${{ inputs.from_station }}
          TO_STATION: ${{ inputs.to_station }}
          JOURNEY_DATE: ${{ inputs.journey_date }}
          SEAT_CLASS: ${{ inputs.seat_class }}
          DESIRED_TRAINS: ${{ inputs.desired_trains }}

          # Auto-injected by GitHub — script stores this in Supabase
          # so /cancel can identify the exact run.
          GITHUB_RUN_ID: ${{ github.run_id }}

          # Secrets
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RAILWAY_PHONE: ${{ secrets.RAILWAY_PHONE }}
          RAILWAY_PASSWORD: ${{ secrets.RAILWAY_PASSWORD }}

        run: |
          docker run --rm --init \
            --name railway-search-${{ github.run_id }} \
            -e CI \
            -e JOB_ID \
            -e CHAT_ID \
            -e USERNAME \
            -e FROM_STATION \
            -e TO_STATION \
            -e JOURNEY_DATE \
            -e SEAT_CLASS \
            -e DESIRED_TRAINS \
            -e GITHUB_RUN_ID \
            -e TELEGRAM_BOT_TOKEN \
            -e TELEGRAM_CHAT_ID \
            -e SUPABASE_URL \
            -e SUPABASE_KEY \
            -e FIREBASE_SERVICE_ACCOUNT \
            -e RAILWAY_PHONE \
            -e RAILWAY_PASSWORD \
            ghcr.io/shuvo-924/railway-search:latest
