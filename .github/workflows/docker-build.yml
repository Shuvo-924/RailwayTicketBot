name: Build Railway Search Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # Checkout public runner repo (holds the Dockerfile)
      - name: Checkout public runner
        uses: actions/checkout@v4
        with:
          path: runner

      # Checkout private core repo (holds bot_backup.py + requirements.txt)
      - name: Checkout private core
        uses: actions/checkout@v4
        with:
          repository: Shuvo-924/RailwayTicketBotCore
          token: ${{ secrets.CORE_REPO_PAT }}
          path: core

      # Login to GitHub Container Registry
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -f runner/Dockerfile \
            -t ghcr.io/shuvo-924/railway-search:latest \
            .

      # Push image to GHCR
      - name: Push Docker image
        run: |
          docker push ghcr.io/shuvo-924/railway-search:latest